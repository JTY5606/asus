	  	<div class="card-body">

	      		<thead>
	        		<tr>
				    	<th scope="col" ><input class="form-check-input" type="checkbox" id="defaultCheck1"></th>

				        <th scope="col">seq</th>
				        <th scope="col">이름</th>

				        <th scope="col">삭제여부</th>
	    			</tr>
	  			</thead>
	  			<tbody>
	  				<tr th:if="${#lists.isEmpty(list)}">
	                	<td colspan="10">
	                		<p>There are no date!</p>
	                	</td>
	                </tr>
	                <tr th:if="${!#lists.isEmpty(list)}" th:each="list : ${list}">
			    		<td><input class="form-check-input" type="checkbox" id="defaultCheck1"></td>
			    		<td></td>
			      		<td th:text="${list.userseq}"></td>
			      		<td th:text="${list.username}">Y</td>
			      		<td th:text="${list.usergender}">42</td>
			      		<td th:text="${list.userid}"></td>
			      		<td th:text="${list.useremail}"> </td>
			      		<td th:text="${list.userpassword}">8</td>
			      		<td th:text="${list.userdate}">1</td>
			      		<td th:text="${list.userphoneNumber}"></td>
			      		<td th:text="${list.userfirstaddress}"></td>
			      		<td th:text="${list.usersecondaddress}"></td>
			      		<td th:text="${list.userthirdaddress}"></td>
			      		<td th:text="${list.userdelNy}"></td>
			   		 </tr>

			<div class="buttons" >

		          				<span class="sr-only">Next</span>

		    		</ul>
