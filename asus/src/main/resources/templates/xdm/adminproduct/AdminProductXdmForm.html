<script type="text/javascript">

document.getElementById("btnSubmit").onclick = function(){
	 if(validation() == false) return false;
	 save();
};
function validation(){
	let whether = true;
	let ifprtitle = document.getElementById("ifprtitle");
	let ifprprice = document.getElementById("ifprprice");
	let ifprdiscout = document.getElementById("ifprdiscout");
	let ifprimfo = document.getElementById("ifprimfo");
	let ifprorigin = document.getElementById("ifprorigin");
	let ifprdeliveryimfo = document.getElementById("ifprdeliveryimfo");
	let ifprcomposition = document.getElementById("ifprcomposition");
	let ifprproductNumber = document.getElementById("ifprproductNumber");
	let ifprinvetory = document.getElementById("ifprinvetory");
	let ifprtypeNy = document.getElementById("ifprtypeNy");
	let ifprdelNy = document.getElementById("ifprdelNy");
	let ifpruseNy = document.getElementById("ifpruseNy");

	if(ifprcategory.value == null || ifprcategory.value == "" ){
		ifprcategory.className = "form-control is-invalid";
		document.getElementById("validation02").innerText ="카테고리를 입력해주세요";
		ifprcategory.focus();
	}else{
		ifprcategory.className = "form-control";
		document.getElementById("validation02").innerText ="";
	}
	
	if(ifprtitle.value == null ||ifprtitle.value == ""){
		ifprtitle.className = "form-control is-invalid";
		document.getElementById("validation03").innerText ="제목을 입력해주세요";
		ifprtitle.focus();
		whether = false;
	}else{
		ifprtitle.className = "form-control";
		document.getElementById("validation03").innerText ="";
	}
	if(ifprprice.value == null ||ifprprice.value == ""){
		ifprprice.className = "form-control is-invalid";
		document.getElementById("validation04").innerText ="가격을 입력해주세요";
		ifprprice.focus();
		whether = false;
	}else{
		ifprprice.className = "form-control";
		document.getElementById("validation04").innerText ="";
	}
	if(ifprdiscout.value == null ||ifprdiscout.value == ""){
		ifprdiscout.className = "form-control is-invalid";
		document.getElementById("validation05").innerText ="할인가를 입력해주세요";
		ifprdiscout.focus();
		whether = false;
	}else{
		ifprdiscout.className = "form-control";
		document.getElementById("validation05").innerText ="";
	}
	if(ifprimfo.value == null ||ifprimfo.value == ""){
		ifprimfo.className = "form-control is-invalid";
		document.getElementById("validation06").innerText ="정보를 입력해주세요";
		ifprimfo.focus();
		whether = false;
	}else{
		ifprimfo.className = "form-control";
		document.getElementById("validation06").innerText="";
	}
	if(ifprorigin.value == null ||ifprorigin.value == ""){
		ifprorigin.className = "form-control is-invalid";
		document.getElementById("validation07").innerText ="원산지를 입력해주세요";
		ifprorigin.focus();
		whether = false;
	}else{
		ifprorigin.className = "form-control";
		document.getElementById("validation07").innerText="";
	}
	if(ifprdeliveryimfo.value == null ||ifprdeliveryimfo.value == ""){
		ifprdeliveryimfo.className = "form-control is-invalid";
		document.getElementById("validation08").innerText ="배송정보를 입력해주세요";
		ifprdeliveryimfo.focus();
		whether = false;
	}else{
		ifprdeliveryimfo.className = "form-control";
		document.getElementById("validation08").innerText ="";
	}
	if(ifprcomposition.value == null ||ifprcomposition.value == ""){
		ifprcomposition.className = "form-control is-invalid";
		document.getElementById("validation09").innerText ="상품구성를 입력해주세요";
		ifprcomposition.focus();
		whether = false;
	}else{
		ifprcomposition.className = "form-control";
		document.getElementById("validation09").innerText  ="";
	}
	if(ifprproductNumber.value == null ||ifprproductNumber.value == ""){
		ifprproductNumber.className = "form-control is-invalid";
		document.getElementById("validation10").innerText ="제품번호를 입력해주세요";
		ifprproductNumber.focus();
		whether = false;
	}else{
		ifprproductNumber.className = "form-control";
		document.getElementById("validation10").innerText ="";
	}
	
	
	return whether ;
}

function save() {
	let seq = document.querySelector("input[name=ifprseq]");		
	if(seq.value == "0" || seq.value == "") {
//			if(validationInst() == false) return false;
//			$("#exampleModal").modal("show");
		form.action = "/xdm/adminproduct/AdminProductXdmInst";
		form.submit();
	} else {
//			if(validationUpdt() == false) return false;
//			$("#exampleModal").modal("show");
		form.action = "AdminProductXdmUpdt";
		form.submit();
	}
}

</script>
