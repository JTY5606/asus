<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

	<div th:replace="~{xdm/include/head :: head}"></div>
<body>
	<form name="formList" id="formList" method="post" autocomplete="off">
		<input type="hidden" name="thisPage" th:value="${vo.thisPage}" default="1"/>
		<input type="hidden" id="rowNumToShow" name="rowNumToShow" th:value="${vo.rowNumToShow}"/>
		<input type="hidden" name="ifcgseq" >
		<input type="hidden" name="ifcguseNy" >
      	<!-- Main Content -->
      	<div class="main-content">
        	<div class="card">
          		<div class="card-header">
            		<h2>CodeGroup</h2z>
          		</div>
          		<div class="card-body">
	            	<div class="row">
		              	<div class="col-sm-2">
		                	<div class="form-group">
			                  	<select id="shDelNy" name="shDelNy" class="form-control form-control-sm">
			                    	<option value="" th:selected="${vo.shDelNy == null}">삭제여부</option>
									<option value="1" th:selected="${vo.shDelNy == 1}">Y</option>
									<option value="0" th:selected="${vo.shDelNy == 0}">N</option> 
			                 	</select>
		                	</div>
		              	</div>
		              	<div class="col-2">
		                	<div class="form-group">
		                  		<select name="shUseNy" id="shUseNy" class="form-control form-control-sm">
									<option value="" th:selected="${vo.shUseNy == null}">사용여부</option>
									<option value="1" th:selected="${vo.shUseNy == 1}">Y</option>
									<option value="0" th:selected="${vo.shUseNy == 0}">N</option>    
							  	</select>
		                	</div>
		              	</div>
		              	<div class="col-2">
		                	<div class="form-group">
		                  		<select id="shOptionDate" name="shOptionDate" class="form-control form-control-sm">
		                    		<option value="" th:selected="${vo.shOptionDate == null}">날짜</option>
									<option value="1" th:selected="${vo.shOptionDate == 1}">등록일</option>
									<option value="2" th:selected="${vo.shOptionDate == 2}">수정일</option>
		                  		</select>
		                	</div>
		              	</div>
		              	<div class="col-2">
		      				<div class="form-group">
		      					<input type="text" id="shDateStart" name="shDateStart"  placeholder="시작일" class="form-control" />
		      				</div>
		    			</div>
		    			<div class="col-2">
		      				<div class="form-group">
		      					<input type="text" id="shDateEnd" name="shDateEnd"  placeholder="종료일" class="form-control" />
		      				</div>
		    			</div>
	         		</div>
		            <div class="row">
		              	<div class="col-2">
		                	<div class="form-group">
		                  		<select id="shOption" name="shOption" class="form-control form-control-sm">
			                   		<option value="" th:selected="${vo.shOption == null}">검색구분</option>
									<option value="1" th:selected="${vo.shOption == 1}">코드그룹 코드</option>
									<option value="2" th:selected="${vo.shOption == 2}">코드그룹 이름</option>
				                </select>
		                	</div>
		              	</div>
		              	<div class="col-2">
		                	<div class="form-group">
								<input type="text" id="shValue" name="shValue" th:value="${vo.shValue}" onkeyup="enterkey()" placeholder="검색어" class="form-control"> 
							</div>
		             	 	<div class="invalid-feedback" id="shValueFeedback"></div>
		             	</div>
		              	<div class="col-2">
		              		<button type="button" id="btnSearch" class="btn btn-outline-secondary btn-sm btn_custom"><i class="fa-solid fa-magnifying-glass fa-lg">검색</i></button>
							<button type="button" id="btnReset" class="btn btn-outline-secondary btn-sm btn_custom"><i class="fa-solid fa-rotate-right fa-lg">리셋</i></button>
		              	</div>
	            	</div>
     			</div>
			</div>
    		<div class="card">
	    		<div class="card-header">
	            	<div class="col-10">
	              		<h4>Total : <span th:text="${vo.totalRows}" ></span></h4>
	            	</div>
	            	<div class="col">
	              		<div class="form-group">
	                		<select class="form-control form-control-sm" id="changeRowNum" name="changeRowNum" >
			                	<option value="1" th:selected="${vo.rowNumToShow eq 1}">1</option>
			                  	<option value="5" th:selected="${vo.rowNumToShow eq 5}">5</option>
								<option value="10" th:selected="${vo.rowNumToShow eq 10}">10</option>
								<option value="30" th:selected="${vo.rowNumToShow eq 30}">30</option>
								<option value="50" th:selected="${vo.rowNumToShow eq 50}">50</option>
								<option value="80" th:selected="${vo.rowNumToShow eq 80}">80</option>
								<option value="100" th:selected="${vo.rowNumToShow eq 100}">100</option>
	                		</select>
	              		</div>
	            	</div>
	     		</div>
        		<div class="card-body">
	            	<table class="table text-center">
	              		<thead>
	                		<tr>
			                  	<th scope="col" ><input class="form-check-input" type="checkbox" id="defaultCheck1"></th>
			                  	<th scope="col">#</th>
			                  	<th scope="col">삭제여부</th>
			                  	<th scope="col">코드그룹 코드(seq)</th>
			                  	<th scope="col" style="width: 25%;">코드그룹 이름(name)</th>
			                  	<th scope="col">사용여부</th>
			                  	<th scope="col">갯수</th>
			                  	<th scope="col">등록일</th>
			                  	<th scope="col">수정일</th>
	                		</tr>
	              		</thead>
	              		<tbody>
		             	 	<tr th:if="${#lists.isEmpty(list)}">
		                		<td colspan="10">
		                			<p>There are no date!</p>
		                		</td>
		                	</tr>
		                	<tr th:if="${!#lists.isEmpty(list)}" th:each="list : ${list}">
		                  		<td><input class="form-check-input" type="checkbox" id="defaultCheck1"></td>
		                  		<td th:text="${vo.totalRows - ((vo.thisPage - 1) * vo.rowNumToShow + listStat.index)}"></td>
			                  	<td th:text="${list.ifcgdelNy}">Y</td>
			                  	<td th:text="${list.ifcgseq}">42</td>
								<td class="ifcgname"><a href="javascript:void(0)" th:text="${list.ifcgname}"  th:attr="onclick=|goForm('${list.ifcgseq}')|"></a></td>
		                  		<td th:text="${list.ifcguseNy}"></td>
		                  		<td th:text="${list.ifcgseqcount}"></td>
		                  		<td th:text="${list.datetimestart}"></td>
		                  		<td th:text="${list.datetimeend}"></td>
		                	</tr>
	              		</tbody>
	            	</table>
            		<div class="buttons" >
	              		<nav aria-label="Page navigation example">
	                		<ul class="pagination justify-content-center">
	                			<li th:if="${vo.startPage gt vo.pageNumToShow}" class="page-item" style="cursor: pointer;">
									<a class="page-link"  th:attr="onclick=|goList('${vo.startPage - 1}')|">
										<span aria-hidden="true">&laquo;</span>
	                      				<span class="sr-only">Previous</span>
									</a>
								</li>
								<li th:each="num: ${#numbers.sequence(vo.startPage, vo.endPage)}" th:classappend="${num eq vo.thisPage} ? active : ''" class="page-item" style="cursor: pointer;">
									<a class="page-link" th:attr="onclick=|goList('${num}')|" th:text="${num}"><!-- ${i.index} --></a>
								</li>
								<li th:if="${vo.endPage ne vo.totalPages}" class="page-item" style="cursor: pointer;">
									<a class="page-link" th:attr="onclick=|goList('${vo.endPage + 1}')|">
										<span aria-hidden="true">&raquo;</span>
	                      				<span class="sr-only">Next</span>
									</a>
								</li>
	                		</ul>
	              		</nav>
            		</div>
	            	<div class="row">
	              		<div class="col-12">
							<button type="button" id="btnForm" class="btn btn-primary btn-sm btn_custom"><i class="fas fa-plus fa-lg">등록</i></button>
	              		</div>
	              	</div>
          		</div>
        	</div>
		</div>
	</form>
</body>

 <div th:replace="~{xdm/include/footer :: footer}"></div>
<script type="text/javascript">

let form = document.querySelector("form[name=formList]");
let goUrlXdmList = "CodeGroupXdmList";
let seq = document.querySelector("input[name=ifcgseq]");

goList = function (thisPage) {
    document.querySelector("input[name=thisPage]").value = thisPage;
    form.action = "CodeGroupXdmList";
    form.submit();
}

document.getElementById("changeRowNum").onchange = function () {
    document.getElementById("rowNumToShow").value = document.getElementById("changeRowNum").value;
    form.action = "CodeGroupXdmList";
    form.submit();
}

document.getElementById("btnSearch").onclick = function () {
    form.action = "CodeGroupXdmList";
    form.submit();
};
document.getElementById("btnReset").onclick = function () {
	form.action = "CodeGroupXdmList";
	document.getElementById("shOption").value = "";
	document.getElementById("shValue").value = "";
    form.submit();
};

document.getElementById("btnForm").onclick = function () {
    goForm(0);
}


goForm = function (keyValue) {
    seq.value = keyValue;
    form.action = "CodeGroupXdmForm";
    form.submit();
}

//   jQuery('#datetimepicker').datetimepicker({
// 	  format:'d.m.Y H:i',
// 	  lang:'ko'
// 	});

jQuery.datetimepicker.setLocale('ko');

jQuery(function(){
	jQuery('#shDateStart').datetimepicker({
		format:'Y-m-d',
		timepicker:false,
		onShow:function(ct) {
			this.setOptions({
				maxDate:jQuery('#shDateEnd').val()?jQuery('#shDateEnd').val():false
			})
		},
	 });
	
	jQuery('#shDateEnd').datetimepicker({
		/*datepicker:false,
		format:'H:i',*/
		format:'Y-m-d',
		timepicker:false,
		onShow:function(ct) {
			this.setOptions({
				minDate:jQuery('#shDateStart').val()?jQuery('#shDateStart').val():false
			})
		},
	});
});
</script>
     
</html>
