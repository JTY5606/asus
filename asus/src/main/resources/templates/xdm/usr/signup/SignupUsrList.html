  <!-- Libs CSS -->

  <link href="/xdm/template/freshcart-14.0/assets/libs/feather-webfont/dist/feather-icons.css" rel="stylesheet">

<body>
 <!-- navigation -->
<header class="py-lg-5 py-4 border-bottom border-bottom-lg-0">
	<div class="container">
		<div class="row w-100 align-items-center gx-3">
			<div class="col-xl-7 col-lg-8">
				<div class="d-flex align-items-center">
					<a class="navbar-brand d-none d-lg-block" href="/xdm/usr/index/IndexUsrList">
						<img src="/xdm/template/freshcart-14.0/assets/images/logo/freshcart-logo.svg" alt="eCommerce HTML Template" />
					</a>
					<div class="w-100 ms-4 d-none d-lg-block">
						<form action="#">
							<div class="input-group">
								<input class="form-control rounded" type="search"
									placeholder="제품 검색" />
								<span class="input-group-append">
									<button class="btn bg-white border border-start-0 ms-n10 rounded-0 rounded-end"
										type="button">
										<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
											viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
											stroke-linecap="round" stroke-linejoin="round"
											class="feather feather-search">
											<circle cx="11" cy="11" r="8"></circle>
											<line x1="21" y1="21" x2="16.65" y2="16.65"></line>
										</svg>
									</button>
								</span>
							</div>
						</form>
					</div>
				</div>
				<div class="d-flex justify-content-between align-items-center w-100 d-lg-none">
					<a class="navbar-brand mb-0" href="index-4.html">
						<img src="/xdm/template/freshcart-14.0/assets/images/logo/freshcart-logo.svg" alt="eCommerce HTML Template" />
					</a>

				</div>
			</div>
			<div class="col-xl-5 col-lg-4 d-flex align-items-center">
				<div class="list-inline ms-auto d-lg-block d-none">
					<div class="list-inline-item me-3 ">
						<a class="text-muted position-relative" data-bs-toggle="offcanvas"
							data-bs-target="#offcanvasRight" href="#offcanvasExample" role="button"
							aria-controls="offcanvasRight">
							<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
								fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
								stroke-linejoin="round" class="feather feather-shopping-bag">
								<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
								<line x1="3" y1="6" x2="21" y2="6"></line>
								<path d="M16 10a4 4 0 0 1-8 0"></path>
							</svg>
							<span
								class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-success">
								1
								<span class="visually-hidden">unread messages</span>
							</span>
						</a>
					</div>
					<div class="list-inline-item">
						<a href="/xdm/usr/login/LoginUsrList" class="btn btn-dark d-none d-xl-block">로그인</a>

<hr>

<main>
   <!-- section -->

<section class="my-lg-14 my-8">
  	<!-- container -->
	<div class="container">
  		<!-- row -->
  		<div class="row justify-content-center align-items-center">
    		<div class="col-12 col-md-6 col-lg-4 order-lg-1 order-2">
      			<!-- img -->
      			<img src="/xdm/template/freshcart-14.0/assets/images/svg-graphics/signup-g.svg" alt="" class="img-fluid" />
    		</div>
    		<!-- col -->
    		<div class="col-12 col-md-6 offset-lg-1 col-lg-4 order-lg-2 order-1">
      			<div class="mb-lg-9 mb-5">
        			<h1 class="mb-1 h2 fw-bold">회원가입</h1>
        			<p></p>
      			</div>
      			<!-- form -->
      			<form class="needs-validation" novalidate>
        			<div class="row g-3">
          				<!-- col -->
          				<div class="col">
            				<!-- input -->
            				<label for="formSignupfname" class="form-label visually-hidden">이름</label>
            				<input type="text" maxlength="20"  class="form-control" id="formSignupfname" placeholder="이름" required />
            				<div class="invalid-feedback">다시 입력해주세요</div>
          				</div>
          				<div class="col" >
            				<div class="form-check form-check-inline">
              					<input class="form-check-input" type="radio" name="inlineRadioOptions"
                				id="inlineRadio1" value="option1" checked />
              					<label class="form-check-label" for="inlineRadio1">남</label>
            				</div>
            				<!-- input -->
            				<div class="form-check form-check-inline">
              					<input class="form-check-input" type="radio" name="inlineRadioOptions"
                				id="inlineRadio2" value="option2" />
              					<label class="form-check-label" for="inlineRadio2">여</label>
            				</div>
            				<!-- input -->
          				</div>
          				<div class="col-12">
            				<!-- input -->
            				<label for="formSignuplname" class="form-label visually-hidden">ID</label>
            				<input type="text" maxlength="15" class="form-control" id="formSignuplname" placeholder="ID" required />
            				<div class="invalid-feedback">다시 입력해주세요</div>
          				</div>
          				<div class="col-12">
            				<!-- input -->
            				<label for="formSignupEmail" class="form-label visually-hidden">Email address</label>
            				<input type="email" maxlength="40" class="form-control" id="formSignupEmail" placeholder="Email" required />
            				<div class="invalid-feedback">다시 입력해주세요</div>
          				</div>
          				<div class="col-12">
            				<div class="password-field position-relative">
              					<label for="formSignupPassword" class="form-label visually-hidden">Password</label>
              					<div class="password-field position-relative">
                					<input type="password" maxlength="20"class="form-control fakePassword" id="formSignupPassword"
                  					placeholder="비밀번호 확인" required />
                					<span><i class="bi bi-eye-slash passwordToggler"></i></span>
                					<div class="invalid-feedback">12자 이상 입력해주세요</div>
              					</div>
            				</div>
          				</div>
          				<div class="col-12">
            				<div class="password-field position-relative">
              					<label for="formSignupPassword" class="form-label visually-hidden">Password</label>
              					<div class="password-field position-relative">
                					<input type="password" maxlength="20" class="form-control fakePassword" id="formSignupPassword"
                  					placeholder="비밀번호 확인" required />
                					<span><i class="bi bi-eye-slash passwordToggler"></i></span>
                				<div class="invalid-feedback">12자 이상 입력해주세요</div>
              					</div>
            				</div>
          				</div>
          				<div class="col">
            				<label for="formSignupfname" class="form-label visually-hidden"></label>
            				<input type="text" maxlength="8" class="form-control" id="formSignupfname" placeholder="생년월일 ex)19920228" required />
            				<div class="invalid-feedback">다시 입력해주세요</div>
          				</div>
          				<div class="col">
            				<label for="formSignupfname" class="form-label visually-hidden"></label>
            				<input type="text" maxlength="11" class="form-control" id="formSignupfname" placeholder="핸드폰 번호(-빼고입력)" required />
            				<div class="invalid-feedback">다시 입력해주세요</div>
          				</div>
          				<div class="col-12">
            				<label for="formSignupfname" class="form-label visually-hidden"></label>
            				<input type="text" maxlength="30" class="form-control" id="formSignupfname" placeholder="주소입력" required />
            				<div class="invalid-feedback">다시 입력해주세요</div>
          				</div>
          				<div class="col-12">
            				<label for="formSignupfname" class="form-label visually-hidden"></label>
            				<input type="text" maxlength="30" class="form-control" id="formSignupfname" placeholder="상세주소" required />
            				<div class="invalid-feedback">다시 입력해주세요</div>
          				</div>
          				<div class="col-12">
            				<label for="formSignupfname" class="form-label visually-hidden"></label>
            				<input type="text" maxlength="30" class="form-control" id="formSignupfname" placeholder="우편번호" required />
            				<div class="invalid-feedback">다시 입력해주세요</div>
          				</div>
          				<!-- btn -->
          				<div class="col-12 d-grid"><button type="submit" class="btn btn-primary">가입</button></div>

          				<!-- text -->
              			<p>
                			<small>
                  				계속 진행하시면 당사
                  				<a href="#!">서비스 약관</a>
                  				및
                  				<a href="#!">개인정보 보호정책에 동의하시는것 입니다</a>
                			</small>
              			</p>
            		</div>
          		</form>
        	</div>
      	</div>
    </div>
</section>
</main>
