<script type="text/javascript">

document.getElementById("login").onclick = function(){
	if(validation()){
		loginLogic();
	}
};

function validation(){
	let whether = true;
	let id = document.getElementById("userid");
	let password = document.getElementById("userpassword");
	
	if(id.value == null ||id.value == ""){
		id.className = "form-control is-invalid";
		document.getElementById("validation01").innerText ="아이디를 입력해주세요";
		id.focus();
		whether = false;
	}else{
		id.className = "form-control";
		id.innerText ="";
	}
	
	if(password.value == null || password.value == "" ){
		password.className = "form-control is-invalid";
		document.getElementById("validation02").innerText ="비밀번호를 입력해주세요";
		password.focus();
		whether = false;
	}else{
		password.className = "form-control";
		password.innerText= "";
	}
	
	return whether ;
}



function loginLogic (){
	if(validation() == false) return false;
	$.ajax({
		async: true 
		,cache: false
		,type: "post"
		/* ,dataType:"json" */
		,url: "/signinXdmProc"
		
		/* ,data : $("#formLogin").serialize() */
		,data : { "userid" : $("#userid").val(), "userpassword" : $("#userpassword").val()}
		,success: function(response) {
			if(response.rt == "success") {
				location.href = "/xdm/usr/index/IndexUsrList";
			} else if(response.rt == false){
		 		document.getElementById("modalAlertTitle").innerText = "확 인";
		 		document.getElementById("modalAlertBody").innerText = "일치하는 회원이 존재 하지 않습니다!";
		 		$("#exampleModal").modal("show");	
			}
		}
		,error : function(jqXHR, textStatus, errorThrown){
			alert("ajaxUpdate " + jqXHR.textStatus + " : " + jqXHR.errorThrown);
		}
	});
}
</script>"
